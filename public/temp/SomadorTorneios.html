<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somador de Torneios · Clube de Xadrez Erbo Stenzel</title>
    <script src="../js/tema.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="../img/logo.svg">
    <link href="../css/tema.css" rel="stylesheet">
    <style>
        .torneios-list { max-height: 460px; overflow-y: auto; }
        .torneio-item label { display: flex; gap: .6rem; align-items: center; font-weight: 600; cursor: pointer; }
        .torneio-item .torneio-info { font-size: .82rem; color: var(--xd-muted); margin-left: 1.6rem; }
        .results-section { display: none; }
        .results-section.show { display: block; }
    </style>
</head>
<body data-pagina="torneios" data-base="../">
    <header class="page-hero">
        <div class="container d-flex align-items-center gap-3">
            <div class="hero-icon"><i class="bi bi-calculator"></i></div>
            <div>
                <h1>Somador de torneios</h1>
                <p>Some a pontuação (regra da Copa) de qualquer conjunto de torneios.</p>
            </div>
        </div>
    </header>

    <main class="app-main container">
        <div class="row g-4">
            <div class="col-lg-6">
                <div class="card selection-section">
                    <div class="card-header"><i class="bi bi-check2-square"></i>Selecione os torneios</div>
                    <div id="torneiosContainer" class="torneios-list list-group list-group-flush">
                        <div class="list-group-item loading text-body-secondary"><span class="spinner-border spinner-border-sm me-2"></span>Carregando torneios...</div>
                    </div>
                    <div class="card-footer d-flex flex-wrap gap-2 py-3">
                        <button class="btn btn-sm btn-outline-secondary" id="selectAllBtn">Selecionar todos</button>
                        <button class="btn btn-sm btn-outline-secondary" id="deselectAllBtn">Limpar seleção</button>
                        <button class="btn btn-primary ms-auto" id="calcularBtn"><i class="bi bi-calculator me-1"></i>Calcular resultados</button>
                    </div>
                </div>
            </div>
            <div class="col-lg-6">
                <div id="resultsSection" class="card results-section">
                    <div class="card-header"><i class="bi bi-trophy"></i>Resultados combinados</div>
                    <div id="resultsInfo" class="card-body small text-body-secondary border-bottom"></div>
                    <div class="table-wrap">
                        <table class="table table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>Pos.</th>
                                    <th>Jogador</th>
                                    <th class="text-end">Pontos totais</th>
                                </tr>
                            </thead>
                            <tbody id="resultsBody"></tbody>
                        </table>
                    </div>
                </div>
                <div id="errorDiv" class="alert alert-danger error mt-3" style="display: none;"></div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/ui.js"></script>
    <script src="SomadorTorneios.js"></script>
</body>
</html>
