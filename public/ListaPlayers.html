<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogadores · Clube de Xadrez Erbo Stenzel</title>
    <script src="js/tema.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="img/logo.svg">
    <link href="css/tema.css" rel="stylesheet">
</head>
<body data-pagina="jogadores">
    <header class="page-hero">
        <div class="container d-flex align-items-center gap-3">
            <div class="hero-icon"><i class="bi bi-list-ol"></i></div>
            <div>
                <h1>Lista de jogadores</h1>
                <p><span id="contagem">—</span> jogadores cadastrados no clube.</p>
            </div>
        </div>
    </header>

    <main class="app-main container">
        <div class="card">
            <div class="card-body border-bottom d-flex flex-wrap gap-2 align-items-center">
                <div class="input-group" style="max-width: 20rem;">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input type="search" id="busca" class="form-control" placeholder="Buscar jogador..." aria-label="Buscar jogador">
                </div>
                <div class="btn-group" role="group" aria-label="Ordenação">
                    <button class="btn btn-outline-secondary sort-btn" id="sortAlpha"><i class="bi bi-sort-alpha-down me-1"></i>Nome</button>
                    <button class="btn btn-outline-secondary sort-btn" id="sortID"><i class="bi bi-hash me-1"></i>ID</button>
                    <button class="btn btn-outline-secondary sort-btn active" id="sortRating"><i class="bi bi-sort-numeric-down-alt me-1"></i>Rating</button>
                </div>
                <button id="downloadCSV" class="btn btn-outline-primary ms-auto"><i class="bi bi-download me-1"></i>Baixar CSV</button>
            </div>
            <div class="table-wrap">
                <table id="playersTable" class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th class="d-none d-sm-table-cell">Idade</th>
                            <th>Rating</th>
                            <th class="d-none d-sm-table-cell">Sexo</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td colspan="5" class="text-center py-4"><div class="spinner-border spinner-border-sm me-2"></div>Carregando jogadores...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="./js/firebase-config.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/Listar.js"></script>
    <script>
        let allPlayers = []; // Armazenar todos os jogadores
        let ordemAtual = 'rating';

        document.addEventListener('DOMContentLoaded', function() {
            ListDBJSON();
            // Adicionar evento ao botão de download
            document.getElementById('downloadCSV').addEventListener('click', downloadCSV);

            // Adicionar eventos aos botões de ordenação
            document.getElementById('sortAlpha').addEventListener('click', function() {
                ordenarJogadores('alfabetico');
                atualizarBotoesAtivos('sortAlpha');
            });

            document.getElementById('sortID').addEventListener('click', function() {
                ordenarJogadores('id');
                atualizarBotoesAtivos('sortID');
            });

            document.getElementById('sortRating').addEventListener('click', function() {
                ordenarJogadores('rating');
                atualizarBotoesAtivos('sortRating');
            });

            document.getElementById('busca').addEventListener('input', () => ordenarJogadores(ordemAtual));
        });

        function atualizarBotoesAtivos(botaoAtivo) {
            const botoes = document.querySelectorAll('.sort-btn');
            botoes.forEach(btn => btn.classList.remove('active'));
            document.getElementById(botaoAtivo).classList.add('active');
        }

        function ordenarJogadores(tipo) {
            ordemAtual = tipo;
            const termo = document.getElementById('busca').value.trim().toLocaleLowerCase('pt-BR');
            let jogadoresOrdenados = allPlayers.filter(p => !termo || String(p.Nome).toLocaleLowerCase('pt-BR').includes(termo));

            if (tipo === 'alfabetico') {
                jogadoresOrdenados.sort((a, b) => a.Nome.localeCompare(b.Nome, 'pt-BR'));
            } else if (tipo === 'id') {
                jogadoresOrdenados.sort((a, b) => parseInt(a.id) - parseInt(b.id));
            } else if (tipo === 'rating') {
                jogadoresOrdenados.sort((a, b) => b.Rating - a.Rating); // Decrescente
            }

            populateTable(jogadoresOrdenados);
        }

        // Função para converter a tabela em CSV e fazer o download
        function downloadCSV() {
            const table = document.getElementById('playersTable');
            let csv = [];

            // Cabeçalho
            const header = [];
            const headerCells = table.querySelectorAll('thead th');
            headerCells.forEach(cell => {
                header.push(cell.textContent);
            });
            csv.push(header.join(';'));

            // Dados
            const rows = table.querySelectorAll('tbody tr');
            rows.forEach(row => {
                const rowData = [];
                const cells = row.querySelectorAll('td');
                cells.forEach(cell => {
                    rowData.push(cell.dataset.csv ?? cell.textContent.trim());
                });
                csv.push(rowData.join(';'));
            });

            // Criar o blob e fazer o download
            const csvContent = csv.join('\n');
            const blob = new Blob(['﻿' + csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);

            link.setAttribute('href', url);
            link.setAttribute('download', 'lista_jogadores.csv');
            link.style.visibility = 'hidden';

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
