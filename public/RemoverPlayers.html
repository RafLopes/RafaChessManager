<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remover Jogador · Clube de Xadrez Erbo Stenzel</title>
    <script src="js/tema.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="img/logo.svg">
    <link href="css/tema.css" rel="stylesheet">
</head>
<body data-pagina="jogadores" data-admin>
    <header class="page-hero">
        <div class="container d-flex align-items-center gap-3">
            <div class="hero-icon"><i class="bi bi-person-x"></i></div>
            <div>
                <h1>Remover jogador</h1>
                <p>Exclui o cadastro do jogador. O histórico dos torneios já encerrados é mantido.</p>
            </div>
        </div>
    </header>

    <main class="app-main container">
        <div class="card mx-auto" style="max-width: 40rem;">
            <div class="card-body p-4">
                <div class="row g-3 align-items-end">
                    <div class="col-sm-8">
                        <label for="seletorJogador" class="form-label">Jogador</label>
                        <select id="seletorJogador" class="form-select">
                            <option value="">Carregando jogadores...</option>
                        </select>
                    </div>
                    <div class="col-sm-4">
                        <label for="playerId" class="form-label">ou ID</label>
                        <input type="number" id="playerId" name="playerId" class="form-control" required>
                    </div>
                </div>
                <div class="mt-3 text-end">
                    <button type="button" class="btn btn-primary" onclick="loadPlayer()"><i class="bi bi-search me-1"></i>Carregar informações</button>
                </div>
                <div id="playerInfo" class="player-info mt-3"></div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="./js/firebase-config.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/Remover.js"></script>
</body>
</html>
