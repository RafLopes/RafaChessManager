<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · Clube de Xadrez Erbo Stenzel</title>
    <script src="js/tema.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="img/logo.svg">
    <link href="css/tema.css" rel="stylesheet">
</head>
<body class="login-page">
    <main class="flex-grow-1 d-flex align-items-center justify-content-center p-3">
        <div class="card w-100" style="max-width: 26.25rem;">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <img src="img/logo.svg" alt="" width="64" height="64" class="mb-3 rounded-3 shadow-sm">
                    <h1 class="h3 mb-1">Área do administrador</h1>
                    <p class="text-body-secondary mb-0">Clube de Xadrez Erbo Stenzel</p>
                </div>
                <div id="avisoTeste"></div>
                <form id="loginForm" novalidate>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" id="email" class="form-control" autocomplete="username" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Senha</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-key"></i></span>
                            <input type="password" id="password" class="form-control" autocomplete="current-password" required>
                            <button class="btn btn-outline-secondary" type="button" id="mostrarSenha" aria-label="Mostrar senha"><i class="bi bi-eye"></i></button>
                        </div>
                    </div>
                    <div id="errorMessage" class="text-danger small mb-3" role="alert"></div>
                    <button type="submit" class="btn btn-primary w-100 py-2"><i class="bi bi-box-arrow-in-right me-1"></i>Entrar</button>
                </form>
                <div class="text-center mt-4">
                    <a href="index.html" class="small text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Voltar ao site sem login</a>
                </div>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/login.js"></script>
    <script>
        document.getElementById('mostrarSenha').addEventListener('click', function () {
            const campo = document.getElementById('password');
            const mostrar = campo.type === 'password';
            campo.type = mostrar ? 'text' : 'password';
            this.innerHTML = `<i class="bi bi-eye${mostrar ? '-slash' : ''}"></i>`;
        });
        if (window.AMBIENTE_TESTE) {
            document.getElementById('avisoTeste').innerHTML =
                '<div class="alert alert-warning small py-2"><i class="bi bi-cone-striped me-1"></i>Ambiente de teste (emulador). Use o login fictício do arquivo <code>scripts/seed-emulador.mjs</code>.</div>';
        }
        // Limpa a mensagem de erro ao digitar
        ['email', 'password'].forEach(id => document.getElementById(id).addEventListener('input', () => {
            document.getElementById('errorMessage').textContent = '';
        }));
    </script>
</body>
</html>
