<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Jogador · Clube de Xadrez Erbo Stenzel</title>
    <script src="js/tema.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="img/logo.svg">
    <link href="css/tema.css" rel="stylesheet">
</head>
<body data-pagina="jogadores" data-admin>
    <header class="page-hero">
        <div class="container d-flex align-items-center gap-3">
            <div class="hero-icon"><i class="bi bi-person-plus"></i></div>
            <div>
                <h1>Cadastrar jogador</h1>
                <p>Adicione um novo membro ao ranking do clube.</p>
            </div>
        </div>
    </header>

    <main class="app-main container">
        <div class="card mx-auto" style="max-width: 40rem;">
            <div class="card-body p-4">
                <form id="playerForm">
                    <div class="mb-3">
                        <label for="name" class="form-label">Nome completo</label>
                        <input type="text" id="name" name="name" class="form-control form-control-lg" placeholder="Ex.: Maria da Silva" required>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-sm-4">
                            <label for="age" class="form-label">Idade</label>
                            <input type="number" id="age" name="age" class="form-control" min="3" max="120" required>
                        </div>
                        <div class="col-sm-4">
                            <label for="rating" class="form-label">Rating inicial</label>
                            <input type="number" id="rating" name="rating" class="form-control" min="0" max="3500" placeholder="Ex.: 1500" required>
                        </div>
                        <div class="col-sm-4">
                            <label for="gender" class="form-label">Sexo</label>
                            <select id="gender" name="gender" class="form-select" required>
                                <option value="male">Masculino</option>
                                <option value="female">Feminino</option>
                            </select>
                        </div>
                    </div>
                    <div id="feedback" class="feedback alert d-none" role="status"></div>
                    <div class="d-flex justify-content-end gap-2">
                        <a href="ListaPlayers.html" class="btn btn-outline-secondary">Ver lista</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check2 me-1"></i>Cadastrar</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="./js/firebase-config.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/Cadastrar.js"></script>
</body>
</html>
