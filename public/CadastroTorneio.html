<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Torneio · Clube de Xadrez Erbo Stenzel</title>
    <script src="js/tema.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="img/logo.svg">
    <link href="css/tema.css" rel="stylesheet">
    <style>
        .lista-jogadores { max-height: 420px; overflow-y: auto; }
        .lista-jogadores .list-group-item { cursor: pointer; }
        .lista-jogadores .list-group-item.selecionado { background: var(--xd-gold-soft); }
        .selecionados .ordem { width: 1.8rem; color: var(--xd-muted); font-variant-numeric: tabular-nums; }
    </style>
</head>
<body data-pagina="torneios" data-admin>
    <header class="page-hero">
        <div class="container d-flex align-items-center gap-3">
            <div class="hero-icon"><i class="bi bi-plus-circle"></i></div>
            <div>
                <h1>Cadastrar torneio</h1>
                <p>Defina o formato, a data e escolha os participantes.</p>
            </div>
        </div>
    </header>

    <main class="app-main container">
        <form id="torneioForm">
            <div class="row g-4">
                <div class="col-lg-5">
                    <div class="card">
                        <div class="card-header"><i class="bi bi-info-circle"></i>Dados do torneio</div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label for="nome-torneio" class="form-label">Nome do torneio</label>
                                <input type="text" id="nome-torneio" name="nome-torneio" class="form-control" placeholder="Ex.: Copa Clube 2026 - Etapa 5" required>
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-sm-6">
                                    <label for="formato" class="form-label">Formato</label>
                                    <select id="formato" name="formato" class="form-select" required>
                                        <option value="suico">Suíço</option>
                                        <option value="schuring">Schuring (todos contra todos)</option>
                                    </select>
                                </div>
                                <div class="col-sm-6">
                                    <label for="num-etapas" class="form-label">Número de rodadas</label>
                                    <input type="number" id="num-etapas" name="num-etapas" class="form-control" min="1" required>
                                    <div class="form-text" id="ajudaEtapas">Quantas rodadas o suíço terá.</div>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="data" class="form-label">Data</label>
                                <input type="date" id="data" name="data" class="form-control" required>
                            </div>
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" role="switch" id="copa" name="copa" checked>
                                <label class="form-check-label" for="copa">Vale para a Copa anual</label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-7">
                    <div class="card">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <span><i class="bi bi-people"></i>Participantes</span>
                            <span class="badge rounded-pill text-bg-secondary" id="contadorSelecionados">0 selecionados</span>
                        </div>
                        <div class="card-body">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <div class="input-group input-group-sm mb-2">
                                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                                        <input type="search" id="buscaJogador" class="form-control" placeholder="Buscar jogador..." aria-label="Buscar jogador">
                                    </div>
                                    <div class="list-group lista-jogadores" id="listaJogadores">
                                        <div class="list-group-item text-body-secondary"><span class="spinner-border spinner-border-sm me-2"></span>Carregando...</div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="section-label mb-2">Selecionados (ordem de inscrição)</div>
                                    <ul class="list-group selecionados" id="listaSelecionados"></ul>
                                    <div class="empty-state py-4" id="semSelecionados"><i class="bi bi-hand-index"></i>Clique nos jogadores ao lado para inscrevê-los.</div>
                                </div>
                            </div>
                        </div>
                        <div class="card-footer d-flex justify-content-end gap-2 py-3">
                            <a href="index.html" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check2 me-1"></i>Cadastrar torneio</button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="./js/firebase-config.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/CadastrarTorneio.js"></script>
    <script>
        // IDs dos jogadores escolhidos, na ordem em que foram selecionados
        let selecionados = [];

        document.addEventListener('DOMContentLoaded', async function() {
            const playersJSON = await ListarJogadores();
            const players = JSON.parse(playersJSON);
            window.players = players;
            renderizarListas();

            document.getElementById('buscaJogador').addEventListener('input', renderizarListas);

            // Adicionar evento de change para o campo formato
            document.getElementById('formato').addEventListener('change', function() {
                const formatoValue = this.value;
                const numEtapasField = document.getElementById('num-etapas');
                const ajuda = document.getElementById('ajudaEtapas');

                if (formatoValue === 'schuring') {
                    // Se for Schuring, preencher com 1 e desabilitar
                    numEtapasField.value = '1';
                    numEtapasField.disabled = true;
                    ajuda.textContent = 'No Schuring as rodadas são geradas automaticamente (todos contra todos).';
                } else {
                    // Se for Suíço, habilitar o campo
                    numEtapasField.disabled = false;
                    ajuda.textContent = 'Quantas rodadas o suíço terá.';
                }
            });
        });

        function alternarJogador(id) {
            selecionados = selecionados.includes(id) ? selecionados.filter(s => s !== id) : [...selecionados, id];
            renderizarListas();
        }

        function renderizarListas() {
            const e = UI.escapar;
            const termo = document.getElementById('buscaJogador').value.trim().toLocaleLowerCase('pt-BR');
            const lista = document.getElementById('listaJogadores');
            const visiveis = (window.players || []).filter(p => !termo || String(p.Nome).toLocaleLowerCase('pt-BR').includes(termo));

            lista.innerHTML = visiveis.map(p => {
                const marcado = selecionados.includes(p.id);
                return `<button type="button" class="list-group-item list-group-item-action d-flex align-items-center gap-2 ${marcado ? 'selecionado' : ''}" data-id="${e(p.id)}">
                    <i class="bi bi-${marcado ? 'check-square-fill' : 'square'}"></i>
                    <span class="flex-grow-1 text-start">${e(p.Nome)}</span>
                    <span class="small text-body-secondary num">${e(p.Rating)}</span>
                </button>`;
            }).join('') || '<div class="list-group-item text-body-secondary">Nenhum jogador encontrado.</div>';
            lista.querySelectorAll('[data-id]').forEach(b => b.addEventListener('click', () => alternarJogador(b.dataset.id)));

            const escolhidos = selecionados.map(id => window.players.find(p => p.id === id)).filter(Boolean);
            document.getElementById('listaSelecionados').innerHTML = escolhidos.map((p, i) => `
                <li class="list-group-item d-flex align-items-center gap-2">
                    <span class="ordem">${i + 1}.</span>
                    <span class="flex-grow-1">${e(p.Nome)}</span>
                    <span class="small text-body-secondary num">${e(p.Rating)}</span>
                    <button type="button" class="btn btn-sm btn-link text-danger p-0 ms-1" data-remover="${e(p.id)}" aria-label="Remover ${e(p.Nome)}"><i class="bi bi-x-lg"></i></button>
                </li>`).join('');
            document.querySelectorAll('[data-remover]').forEach(b => b.addEventListener('click', () => alternarJogador(b.dataset.remover)));

            document.getElementById('semSelecionados').classList.toggle('d-none', escolhidos.length > 0);
            document.getElementById('contadorSelecionados').textContent = `${escolhidos.length} selecionado${escolhidos.length === 1 ? '' : 's'}`;
        }

        async function verificarTorneiosAbertos() {
            const db = firebase.firestore();
            try {
                const querySnapshot = await db.collection('torneio').get();
                for (const doc of querySnapshot.docs) {
                    const torneioData = doc.data();
                    if (!torneioData.Resultado) {
                        return {
                            existeTorneioAberto: true,
                            nomeTorneio: torneioData.nome
                        };
                    }
                }
                return {
                    existeTorneioAberto: false
                };
            } catch (error) {
                console.error('Erro ao verificar torneios abertos:', error);
                throw error;
            }
        }

        document.getElementById('torneioForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const botao = this.querySelector('button[type="submit"]');

            try {
                if (selecionados.length < 2) {
                    alert('Por favor, selecione pelo menos 2 jogadores.');
                    return;
                }

                botao.disabled = true;

                // Verificar se existe torneio em aberto
                const { existeTorneioAberto, nomeTorneio } = await verificarTorneiosAbertos();

                if (existeTorneioAberto) {
                    alert(`Não é possível criar um novo torneio. Existe um torneio em aberto: ${nomeTorneio}. Por favor, finalize o torneio em aberto antes de criar um novo.`);
                    return;
                }

                // RECARREGAR jogadores do banco antes de criar torneio (evita cache desatualizado)
                const playersJSON = await ListarJogadores();
                const playersAtualizados = JSON.parse(playersJSON);

                const nome = document.getElementById('nome-torneio').value;
                const formato = document.getElementById('formato').value;
                const copa = document.getElementById('copa').checked;
                const numEtapas = document.getElementById('num-etapas').value;
                const data = document.getElementById('data').value;

                const jogadores = selecionados
                    .map(playerId => playersAtualizados.find(player => player.id === playerId))
                    .filter(Boolean)
                    .map(player => ({
                        id: player.id,
                        nome: player.Nome,
                        rating: player.Rating
                    }));

                if (jogadores.length !== selecionados.length) {
                    alert('Algum jogador selecionado não foi encontrado no cadastro. Recarregue a página.');
                    return;
                }

                const db = firebase.firestore();
                const torneioRef = db.collection('torneio');

                // Encontrar o maior ID existente
                const snapshot = await torneioRef.get();
                const ids = snapshot.docs.map(doc => parseInt(doc.id)).filter(id => !isNaN(id));
                const maiorId = ids.length > 0 ? Math.max(...ids) : 0;
                const newId = maiorId + 1;

                await torneioRef.doc(newId.toString()).set({
                    nome: nome,
                    Formato: formato,
                    copa: copa,
                    etapas: numEtapas,
                    data: data,
                    jogadores: jogadores
                });

                alert('Torneio cadastrado com sucesso!');
                document.getElementById('torneioForm').reset();
                document.getElementById('formato').dispatchEvent(new Event('change'));
                selecionados = [];
                renderizarListas();
            } catch (error) {
                console.error('Error adding document: ', error);
                alert('Erro ao cadastrar torneio.');
            } finally {
                botao.disabled = false;
            }
        });
    </script>
</body>
</html>
