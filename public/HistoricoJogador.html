<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico do Jogador · Clube de Xadrez Erbo Stenzel</title>
    <script src="js/tema.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="img/logo.svg">
    <link href="css/tema.css" rel="stylesheet">
</head>
<body data-pagina="jogadores">
    <header class="page-hero">
        <div class="container d-flex align-items-center gap-3">
            <div class="hero-icon"><i class="bi bi-graph-up"></i></div>
            <div>
                <h1>Histórico do jogador</h1>
                <p>Evolução do rating, torneios disputados e confrontos diretos.</p>
            </div>
        </div>
    </header>

    <main class="app-main container">
        <div class="card mb-4">
            <div class="card-body d-flex flex-wrap gap-2 align-items-end">
                <div class="flex-grow-1" style="min-width: 240px;">
                    <label for="playerSelect" class="form-label">Jogador</label>
                    <select id="playerSelect" class="form-select">
                        <option value="">Selecione um jogador</option>
                    </select>
                </div>
                <button class="btn btn-primary" onclick="loadPlayerHistory()"><i class="bi bi-search me-1"></i>Carregar histórico</button>
            </div>
        </div>

        <div id="playerInfo" class="player-info" style="display: none;">
            <h2 class="h3 mb-3" id="playerName"></h2>
            <div class="row g-3 mb-4">
                <div class="col-6 col-md-4">
                    <div class="card stat-card h-100">
                        <div class="d-flex justify-content-between"><span class="stat-rotulo">Rating atual</span><i class="bi bi-speedometer2 stat-icone"></i></div>
                        <div class="stat-valor num" id="currentRating"></div>
                    </div>
                </div>
                <div class="col-6 col-md-4">
                    <div class="card stat-card h-100">
                        <div class="d-flex justify-content-between"><span class="stat-rotulo">Maior rating</span><i class="bi bi-arrow-up-right-circle stat-icone"></i></div>
                        <div class="stat-valor num" id="maxRating"></div>
                    </div>
                </div>
                <div class="col-12 col-md-4">
                    <div class="card stat-card h-100">
                        <div class="d-flex justify-content-between"><span class="stat-rotulo">Torneios disputados</span><i class="bi bi-trophy stat-icone"></i></div>
                        <div class="stat-valor num" id="totalTournaments"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="tournamentHistory" class="tournament-history" style="display: none;">
            <div class="row g-4">
                <div class="col-lg-8">
                    <div class="card mb-4">
                        <div class="card-header"><i class="bi bi-graph-up"></i>Evolução do rating</div>
                        <div class="card-body">
                            <div class="chart-box"><canvas id="ratingChart"></canvas></div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header"><i class="bi bi-list-task"></i>Torneios</div>
                        <div class="table-wrap">
                            <table class="table table-hover align-middle">
                                <thead>
                                    <tr>
                                        <th>Torneio</th>
                                        <th>Data</th>
                                        <th>Posição</th>
                                        <th>Rating inicial</th>
                                        <th>Variação</th>
                                        <th>Rating final</th>
                                    </tr>
                                </thead>
                                <tbody id="tournamentTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="card opponent-stats">
                        <div class="card-header"><i class="bi bi-people"></i>Confronto direto</div>
                        <div class="card-body">
                            <label for="opponentSelect" class="form-label">Adversário</label>
                            <select id="opponentSelect" class="form-select">
                                <option value="">Selecione um jogador</option>
                            </select>
                            <div id="statsInfo" class="mt-3" style="display: none;">
                                <div class="row g-2 text-center">
                                    <div class="col-4"><div class="border rounded-3 stat-card stat-win p-2"><div class="stat-valor num" id="victories">0</div><div class="stat-rotulo">Vitórias</div></div></div>
                                    <div class="col-4"><div class="border rounded-3 stat-card stat-draw p-2"><div class="stat-valor num" id="draws">0</div><div class="stat-rotulo">Empates</div></div></div>
                                    <div class="col-4"><div class="border rounded-3 stat-card stat-loss p-2"><div class="stat-valor num" id="losses">0</div><div class="stat-rotulo">Derrotas</div></div></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="./js/firebase-config.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/HistoricoJogador.js"></script>
</body>
</html>
