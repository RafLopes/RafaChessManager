<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Torneio · Clube de Xadrez Erbo Stenzel</title>
    <script src="js/tema.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="img/logo.svg">
    <link href="css/tema.css" rel="stylesheet">
</head>
<body data-pagina="torneios" data-admin>
    <header class="page-hero">
        <div class="container d-flex align-items-center gap-3">
            <div class="hero-icon"><i class="bi bi-pencil-square"></i></div>
            <div>
                <h1>Editar torneio</h1>
                <p>Ajuste os dados e os participantes de um torneio em aberto.</p>
            </div>
        </div>
    </header>

    <main class="app-main container">
        <div class="card mb-4">
            <div class="card-body d-flex flex-wrap gap-2 align-items-end">
                <div class="flex-grow-1" style="min-width: 240px;">
                    <label for="tournamentSelect" class="form-label">Torneio em aberto</label>
                    <select id="tournamentSelect" class="form-select">
                        <option value="">Selecione...</option>
                    </select>
                </div>
                <button id="loadTournamentButton" class="btn btn-primary"><i class="bi bi-folder2-open me-1"></i>Carregar torneio</button>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-lg-5">
                <div class="card torneio-info" id="torneio-info" style="display: none;">
                    <div class="card-header"><i class="bi bi-info-circle"></i>Dados do torneio</div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="nome-torneio" class="form-label">Nome do torneio</label>
                            <input type="text" id="nome-torneio" class="form-control campo-editavel">
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-sm-6">
                                <label for="formato-torneio" class="form-label">Formato</label>
                                <select id="formato-torneio" class="form-select campo-editavel">
                                    <option value="suico">Suíço</option>
                                    <option value="schuring">Schuring</option>
                                </select>
                            </div>
                            <div class="col-sm-6">
                                <label for="copa-torneio" class="form-label">Copa</label>
                                <select id="copa-torneio" class="form-select campo-editavel">
                                    <option value="true">Sim</option>
                                    <option value="false">Não</option>
                                </select>
                            </div>
                            <div class="col-sm-6">
                                <label for="etapas-torneio" class="form-label">Rodadas</label>
                                <input type="number" id="etapas-torneio" class="form-control campo-editavel" min="1">
                            </div>
                            <div class="col-sm-6">
                                <label for="data-torneio" class="form-label">Data</label>
                                <input type="date" id="data-torneio" class="form-control campo-editavel">
                            </div>
                        </div>
                    </div>
                    <div class="card-footer d-flex justify-content-between gap-2 py-3">
                        <button id="excluir-torneio" class="btn btn-outline-danger"><i class="bi bi-trash me-1"></i>Excluir torneio</button>
                        <button id="salvar-alteracoes" class="btn btn-primary"><i class="bi bi-check2 me-1"></i>Salvar alterações</button>
                    </div>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="card jogadores-list" id="jogadores-list" style="display: none;">
                    <div class="card-header"><i class="bi bi-people"></i>Participantes</div>
                    <div class="card-body border-bottom">
                        <label for="novo-jogador-nome" class="form-label">Adicionar jogador</label>
                        <div class="input-group">
                            <select id="novo-jogador-nome" class="form-select campo-editavel">
                                <option value="">Selecione um jogador...</option>
                            </select>
                            <span class="input-group-text num" id="novo-jogador-rating" style="min-width: 4.5rem;"></span>
                            <button id="adicionar-jogador" class="btn btn-outline-primary"><i class="bi bi-plus-lg me-1"></i>Adicionar</button>
                        </div>
                        <div class="form-text">As alterações só são gravadas ao clicar em "Salvar alterações".</div>
                    </div>
                    <div class="table-wrap">
                        <table class="table table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>Nome</th>
                                    <th>Rating</th>
                                    <th class="text-end">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="jogadores-tbody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="./js/firebase-config.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/editartorneio.js"></script>
</body>
</html>
