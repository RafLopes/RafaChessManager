<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizar Torneio · Clube de Xadrez Erbo Stenzel</title>
    <script src="js/tema.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="img/logo.svg">
    <link href="css/tema.css" rel="stylesheet">
</head>
<body data-pagina="torneios">
    <header class="page-hero">
        <div class="container d-flex align-items-center gap-3">
            <div class="hero-icon"><i class="bi bi-eye"></i></div>
            <div>
                <h1 id="tituloTorneio">Visualizar torneio</h1>
                <p id="subtituloTorneio">Rodadas, partidas e classificação final dos torneios encerrados.</p>
            </div>
        </div>
    </header>

    <main class="app-main container">
        <div class="card mb-4 no-print">
            <div class="card-body d-flex flex-wrap gap-2 align-items-end">
                <div class="flex-grow-1" style="min-width: 240px;">
                    <label for="tournamentSelect" class="form-label">Torneio</label>
                    <select id="tournamentSelect" class="form-select">
                        <option value="">Selecione...</option>
                    </select>
                </div>
                <button id="loadTournamentButton" class="btn btn-primary"><i class="bi bi-folder2-open me-1"></i>Carregar</button>
                <button id="botaoImprimir" class="btn btn-outline-secondary d-none" onclick="window.print()"><i class="bi bi-printer me-1"></i>Imprimir</button>
            </div>
        </div>

        <div id="tournamentInfo" class="torneio-info mb-4"></div>
        <div class="row g-4">
            <div class="col-lg-8">
                <div id="finalResults" class="resultados-finais"></div>
                <div id="roundsContainer" class="rodadas-container mt-4"></div>
            </div>
            <div class="col-lg-4">
                <div id="playersList" class="jogadores-list"></div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="./js/firebase-config.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/VisualizarTorneio.js"></script>
</body>
</html>
