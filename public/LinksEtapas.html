<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etapas Online · Clube de Xadrez Erbo Stenzel</title>
    <script src="js/tema.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="img/logo.svg">
    <link href="css/tema.css" rel="stylesheet">
</head>
<body data-pagina="online">
    <header class="page-hero">
        <div class="container d-flex align-items-center gap-3">
            <div class="hero-icon"><i class="bi bi-link-45deg"></i></div>
            <div>
                <h1>Etapas online</h1>
                <p>Datas e links de acesso às etapas no Chess.com.</p>
            </div>
        </div>
    </header>

    <main class="app-main container">
        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header"><i class="bi bi-calendar-event"></i>Calendário de etapas</div>
                    <div class="table-wrap">
                        <table class="table table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>Etapa</th>
                                    <th>Data</th>
                                    <th>Status</th>
                                    <th class="text-end">Link</th>
                                </tr>
                            </thead>
                            <tbody id="links-tbody">
                                <tr><td colspan="4" class="text-center py-4"><div class="spinner-border spinner-border-sm me-2"></div>Carregando...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Formulário de cadastro (visível apenas para admin) -->
            <div class="col-lg-4 form-container" style="display: none;">
                <div class="card">
                    <div class="card-header"><i class="bi bi-plus-circle"></i>Adicionar nova etapa</div>
                    <div class="card-body">
                        <form id="etapa-form">
                            <div class="mb-3">
                                <label for="etapa" class="form-label">Número da etapa</label>
                                <input type="number" id="etapa" class="form-control" required min="1">
                            </div>
                            <div class="mb-3">
                                <label for="data" class="form-label">Data</label>
                                <input type="date" id="data" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label for="link" class="form-label">Link</label>
                                <input type="url" id="link" class="form-control" required placeholder="https://...">
                            </div>
                            <button type="submit" class="btn btn-primary w-100"><i class="bi bi-plus-lg me-1"></i>Adicionar etapa</button>
                        </form>
                        <a href="GerenciarEtapasOnline.html" class="btn btn-outline-secondary w-100 mt-2"><i class="bi bi-sliders me-1"></i>Definir etapa atual</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="./js/firebase-config.js"></script>
    <script src="./js/ui.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            const db = firebase.firestore();
            const tbody = document.getElementById('links-tbody');
            const formContainer = document.querySelector('.form-container');
            const e = UI.escapar;

            // Verificar se é admin
            firebase.auth().onAuthStateChanged(function(user) {
                formContainer.style.display = user ? 'block' : 'none';
            });

            // Carregar dados existentes
            async function carregarLinks() {
                try {
                    const snapshot = await db.collection('links_etapas').orderBy('etapa').get();
                    tbody.innerHTML = ''; // Limpar tabela antes de recarregar
                    if (snapshot.empty) {
                        tbody.innerHTML = '<tr><td colspan="4" class="empty-state"><i class="bi bi-calendar-x"></i>Nenhuma etapa cadastrada.</td></tr>';
                    }
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        // Formatando a data para dd/mm/aaaa
                        const dataParts = data.data.split('-');
                        const dataFormatada = `${dataParts[2]}/${dataParts[1]}/${dataParts[0]}`;

                        // Verificar status baseado na data
                        const hoje = new Date();
                        hoje.setHours(0, 0, 0, 0); // Zerar as horas para comparar apenas as datas

                        const dataEtapa = new Date(data.data + 'T00:00:00'); // Forçar timezone local

                        let status = '';

                        if (dataEtapa.getTime() > hoje.getTime()) {
                            status = '<span class="badge text-bg-info">Em breve</span>';
                        } else if (dataEtapa.getTime() === hoje.getTime()) {
                            status = '<span class="badge text-bg-success">Hoje</span>';
                        } else {
                            status = '<span class="badge text-bg-secondary">Realizado</span>';
                        }

                        const linkSeguro = /^https?:\/\//i.test(data.link) ? data.link : '#';
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td class="fw-semibold text-nowrap">Etapa ${e(data.etapa)}</td>
                            <td class="num text-nowrap">${e(dataFormatada)}</td>
                            <td>${status}</td>
                            <td class="text-end"><a href="${e(linkSeguro)}" target="_blank" rel="noopener" class="btn btn-sm btn-outline-primary"><i class="bi bi-box-arrow-up-right"></i><span class="d-none d-sm-inline ms-1">Acessar</span></a></td>
                        `;
                        tbody.appendChild(row);
                    });
                } catch (error) {
                    console.error('Erro ao carregar links:', error);
                }
            }

            // Carregar links iniciais
            carregarLinks();

            // Manipular envio do formulário
            document.getElementById('etapa-form').addEventListener('submit', async function(ev) {
                ev.preventDefault();

                const etapa = document.getElementById('etapa').value;
                const data = document.getElementById('data').value;
                const link = document.getElementById('link').value;

                try {
                    await db.collection('links_etapas').add({
                        etapa: Number(etapa),
                        data: data,
                        link: link
                    });

                    // Limpar formulário
                    this.reset();

                    // Recarregar tabela
                    carregarLinks();

                    alert('Etapa adicionada com sucesso!');
                } catch (error) {
                    console.error('Erro ao adicionar etapa:', error);
                    alert('Erro ao adicionar etapa. Tente novamente.');
                }
            });
        });
    </script>
</body>
</html>
